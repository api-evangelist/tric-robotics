name: TRIC Robotics
description: >-
  TRIC Robotics builds autonomous agricultural robots that replace chemical pesticides with
  ultraviolet light. Its flagship platform, Luna, is a tractor-scale robot that roams California
  strawberry fields after dark, using UV-C light to kill fungal pathogens such as powdery mildew
  and botrytis while a mechanical "Bug Vac" removes pests like Lygus bugs, spotted wing drosophila,
  and spider mites — without a single drop of pesticide. Founded in 2017 by Dr. Adam Stager and
  Vishnu Somasundaram out of the University of Delaware and now based in California, TRIC operates a
  robotics-as-a-service model that requires no upfront investment from growers, and reports pesticide
  reductions of up to 70% across the farms it serves. The company raised a $5.5M seed round led by
  Version One Ventures to expand its fleet across Santa Maria, Oxnard, and Watsonville. TRIC Robotics
  is an agricultural robotics operator and does not currently publish a public developer API, SDK, or
  developer portal; this profile captures its company identity in the API Evangelist network.
